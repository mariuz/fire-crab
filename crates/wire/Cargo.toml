[package]
name = "fire-crab-wire"
version = "0.1.0"
description = "Firebird wire-protocol client (fire-crab) - XDR + connect/accept negotiation"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fire-crab-ods = { path = "../ods" }
fire-crab-burp = { path = "../burp" }
fire-crab-auth = { path = "../auth" }
fire-crab-svc = { path = "../svc" }
fire-crab-blb = { path = "../blb" }
fire-crab-exe = { path = "../exe" }
fire-crab-opt = { path = "../opt" }
fire-crab-cch = { path = "../cch" }
fire-crab-lck = { path = "../lck" }
fire-crab-evt = { path = "../evt" }
fire-crab-pio = { path = "../pio" }
fire-crab-dsql = { path = "../dsql" }

[[bin]]
name = "fcwire"
path = "src/main.rs"

[lib]
name = "fire_crab_wire"
path = "src/lib.rs"
