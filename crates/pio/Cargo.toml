[package]
name = "fire-crab-pio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform I/O: the conversion of Firebird's src/jrd/os/posix/unix.cpp PIO layer - page addressing, page counting, open modes, extension and the file lock - checked against MON$DATABASE, RDB$PAGES and gfix"

[[bin]]
name = "fcpio"
path = "src/main.rs"

[lib]
name = "fire_crab_pio"
path = "src/lib.rs"
