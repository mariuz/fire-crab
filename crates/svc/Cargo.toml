[package]
name = "fire-crab-svc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Services manager: the conversion of Firebird's src/jrd/svc.cpp buffer grammars and info responses, differentially tested with the engine's own fbsvcmgr in both directions"

[dependencies]
fire-crab-auth = { path = "../auth" }

[[bin]]
name = "fcsvc"
path = "src/main.rs"

[lib]
name = "fire_crab_svc"
path = "src/lib.rs"
